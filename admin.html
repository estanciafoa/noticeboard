<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Admin</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #eef1f5;
}

/* LOGIN */
#login {
  position: fixed;
  inset: 0;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}
#loginBox {
  background: white;
  padding: 30px;
  border-radius: 10px;
}

/* HEADER */
.header {
  background: white;
  padding: 10px;
  display: flex;
  gap: 10px;
  border-bottom: 1px solid #ddd;
}

/* LAYOUT */
.container {
  display: flex;
  height: calc(100vh - 60px);
}

/* LEFT */
.left {
  width: 180px;
  background: #f8fafc;
  overflow-y: auto;
  padding: 10px;
}

.thumb {
  width: 100%;
  aspect-ratio: 9 / 16;
  margin-bottom: 10px;
  border-radius: 8px;
  overflow: hidden;
  border: 3px solid transparent;
  cursor: pointer;
}

.thumb.active {
  border: 3px solid #2563eb;
}

.thumb img, .thumb video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* CENTER */
.center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* DISPLAY AREA */
.displayWrapper {
  position: relative;
  height: 90%;
  aspect-ratio: 9 / 16;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CONTENT */
.screenContent {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 1;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
}

.screenContent img,
.screenContent video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* FRAME ON TOP */
.frameOverlay {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* RIGHT */
.right {
  width: 300px;
  background: white;
  padding: 15px;
  border-left: 1px solid #ddd;
}

.field {
  margin-bottom: 10px;
}

input {
  width: 100%;
  padding: 6px;
}

button {
  padding: 8px 12px;
  border: none;
  background: #2563eb;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
.deleteBtn {
  background: #dc2626;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="loginBox">
    <h3>Enter GitHub Token</h3>
    <input type="password" id="tokenInput"><br><br>
    <button onclick="start()">Start</button>
  </div>
</div>

<div id="app" style="display:none">

<div class="header">
  <input type="file" id="fileInput" multiple>
  <button onclick="upload()">Upload</button>
  <button onclick="saveConfig()">Save</button>
</div>

<div class="container">

<!-- LEFT -->
<div class="left" id="thumbList"></div>

<!-- CENTER -->
<div class="center">

  <div class="displayWrapper">

    <!-- CONTENT -->
    <div class="screenContent" id="screenArea"></div>

    <!-- FRAME -->
    <img src="images/screen.png" class="frameOverlay">

  </div>

</div>

<!-- RIGHT -->
<div class="right">

<h3 id="title">Select Slide</h3>

<label><input type="checkbox" id="enabled"> Enable</label>

<div class="field">Duration <input id="duration"></div>
<div class="field">Start Time <input type="time" id="startTime"></div>
<div class="field">End Time <input type="time" id="endTime"></div>
<div class="field">Start Date <input type="date" id="startDate"></div>
<div class="field">End Date <input type="date" id="endDate"></div>
<div class="field">Expiry <input id="expiry"></div>

<button class="deleteBtn" onclick="deleteSlide()">Delete</button>

</div>

</div>
</div>

<script>
const repoOwner="saravanansengamalan";
const repoName="estancianoticeboard";

let token="", files=[], config={}, selected=null;

function start(){
  token=tokenInput.value.trim();
  if(!token)return alert("Token required");
  login.style.display="none";
  app.style.display="block";
  load();
}

async function load(){

  const txt=await fetch(`https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/config.txt`).then(r=>r.text());
  let inSlides=false;

  txt.split("\n").forEach(l=>{
    l=l.trim();
    if(l.toLowerCase()==="slides:"){inSlides=true;return;}
    if(inSlides){
      const p=l.split("|").map(x=>x.trim());
      config[p[0]]={duration:p[1]||"",start:p[2]||"",end:p[3]||"",startDate:p[4]||"",endDate:p[5]||"",expiry:p[6]||""};
    }
  });

  const res=await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/slides`,{
    headers:{Authorization:`Bearer ${token}`}
  });

  const list=await res.json();
  files=list.map(f=>f.name);

  render();
}

function render(){
  const thumbList=document.getElementById("thumbList");
  thumbList.innerHTML="";

  files.forEach(name=>{
    const div=document.createElement("div");
    div.className="thumb";
    if(name===selected)div.classList.add("active");

    const url=`https://${repoOwner}.github.io/${repoName}/slides/${name}`;

    let media=name.match(/\.mp4/i)?document.createElement("video"):document.createElement("img");
    media.src=url;
    if(media.tagName==="VIDEO"){media.muted=true;media.autoplay=true;}

    div.appendChild(media);
    div.onclick=()=>selectSlide(name);

    thumbList.appendChild(div);
  });
}

function selectSlide(name){
  selected=name;
  render();

  const screenEl=document.getElementById("screenArea");
  screenEl.innerHTML="";

  const url=`https://${repoOwner}.github.io/${repoName}/slides/${name}`;

  let media=name.match(/\.mp4/i)?document.createElement("video"):document.createElement("img");
  media.src=url;
  if(media.tagName==="VIDEO"){media.autoplay=true;media.muted=true;}

  screenEl.appendChild(media);

  const c=config[name]||{};
  title.innerText=name;

  enabled.checked=!!config[name];
  duration.value=c.duration||"";
  startTime.value=c.start||"";
  endTime.value=c.end||"";
  startDate.value=c.startDate||"";
  endDate.value=c.endDate||"";
  expiry.value=c.expiry||"";
}
</script>

</body>
</html>
