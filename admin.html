<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Admin</title>

<style>
body { margin:0; font-family:system-ui; background:#eef1f5; }

/* LOGIN */
#login { position:fixed; inset:0; background:#111; display:flex; justify-content:center; align-items:center; }
#loginBox { background:white; padding:30px; border-radius:10px; }

/* TOP */
.topbar { background:white; padding:10px; border-bottom:1px solid #ddd; }

/* LAYOUT */
.container { display:flex; height:calc(100vh - 60px); }

/* LEFT */
.left { width:180px; overflow-y:auto; padding:10px; }

.thumb {
  width:100%; aspect-ratio:9/16; margin-bottom:10px;
  border-radius:8px; overflow:hidden; border:3px solid transparent;
  cursor:grab;
}
.thumb.active { border:3px solid #2563eb; }
.thumb img, .thumb video { width:100%; height:100%; object-fit:cover; }

/* CENTER */
.center { flex:1; display:flex; justify-content:center; align-items:center; }
.tv {
  height:90%; aspect-ratio:9/16;
  background:black; border:12px solid #222;
  border-radius:20px; overflow:hidden;
}
.screen img, .screen video { width:100%; height:100%; object-fit:contain; }

/* RIGHT */
.right { width:280px; background:white; padding:15px; border-left:1px solid #ddd; }
.field { margin-bottom:10px; }
input { width:100%; padding:6px; }

/* UPLOAD */
#uploadPreview { display:flex; gap:10px; padding:10px; overflow-x:auto; }
.previewCard { width:100px; }
.previewCard img { width:100%; aspect-ratio:9/16; object-fit:cover; }

button { padding:8px; margin-top:5px; }
.deleteBtn { background:#dc2626; color:white; width:100%; }
</style>
</head>

<body>

<div id="login">
  <div id="loginBox">
    <h3>GitHub Token</h3>
    <input type="password" id="tokenInput"><br><br>
    <button onclick="start()">Start</button>
  </div>
</div>

<div id="app" style="display:none">

<div class="topbar">
  <button onclick="fileInput.click()">Upload</button>
  <button onclick="saveConfig()">Save</button>
</div>

<input type="file" id="fileInput" multiple style="display:none">
<div id="uploadPreview"></div>

<div class="container">

<div class="left" id="thumbList"></div>

<div class="center">
  <div class="tv">
    <div class="screen" id="screenEl"></div>
  </div>
</div>

<div class="right">
  <h3 id="titleEl">Slide</h3>
  <label><input type="checkbox" id="enabled"> Enable</label>

  <div class="field">Duration <input id="duration"></div>
  <div class="field">Start <input type="time" id="startTime"></div>
  <div class="field">End <input type="time" id="endTime"></div>
  <div class="field">Start Date <input type="date" id="startDate"></div>
  <div class="field">End Date <input type="date" id="endDate"></div>
  <div class="field">Expiry <input id="expiry"></div>

  <button class="deleteBtn" onclick="deleteSlide()">Delete</button>
</div>

</div>
</div>

<script>
const repoOwner="estanciafoa";
const repoName="noticeboard";

let token="", files=[], config={}, selected=null, newFiles=[];

/* GITHUB FETCH */
async function githubFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: {
      ...(options.headers||{}),
      Authorization: `Bearer ${token}`
    }
  });

  if(!res.ok){
    const err = await res.json();
    throw new Error(err.message);
  }

  return await res.json();
}

/* START */
async function start(){
  token = tokenInput.value.trim();
  if(!token) return alert("Token required");

  login.style.display="none";
  app.style.display="block";

  await load();
}

/* LOAD */
async function load(){

  // config
  try{
    const txt = await fetch(`https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/config.txt`).then(r=>r.text());
    let inSlides=false;

    txt.split("\n").forEach(l=>{
      l=l.trim();
      if(l.toLowerCase()==="slides:"){ inSlides=true; return; }
      if(inSlides){
        const p=l.split("|").map(x=>x.trim());
        config[p[0]]={duration:p[1]||"",start:p[2]||"",end:p[3]||"",startDate:p[4]||"",endDate:p[5]||"",expiry:p[6]||""};
        files.push(p[0]);
      }
    });
  }catch(e){}

  // files
  const list = await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/slides`);
  const repoFiles = list.map(f=>f.name);

  repoFiles.forEach(f=>{
    if(!files.includes(f)) files.push(f);
  });

  render();
}

/* RENDER */
function render(){
  thumbList.innerHTML="";

  files.forEach((name,i)=>{
    const div=document.createElement("div");
    div.className="thumb";
    if(name===selected)div.classList.add("active");

    const img=document.createElement("img");
    img.src=`https://${repoOwner}.github.io/${repoName}/slides/${name}`;
    div.appendChild(img);

    div.onclick=()=>selectSlide(name);

    // drag
    div.draggable=true;
    div.ondragstart=()=>dragIndex=i;
    div.ondrop=()=>reorder(i);
    div.ondragover=e=>e.preventDefault();

    thumbList.appendChild(div);
  });
}

let dragIndex;
function reorder(i){
  const item=files.splice(dragIndex,1)[0];
  files.splice(i,0,item);
  render();
}

/* SELECT */
function selectSlide(name){
  selected=name;
  render();

  screenEl.innerHTML="";
  const img=document.createElement("img");
  img.src=`https://${repoOwner}.github.io/${repoName}/slides/${name}`;
  screenEl.appendChild(img);

  const c=config[name]||{};
  titleEl.innerText=name;

  enabled.checked=!!config[name];
  duration.value=c.duration||"";
  startTime.value=c.start||"";
  endTime.value=c.end||"";
  startDate.value=c.startDate||"";
  endDate.value=c.endDate||"";
  expiry.value=c.expiry||"";
}

/* UPDATE */
document.querySelectorAll(".right input").forEach(el=>{
  el.oninput=()=>{
    if(!selected)return;

    if(!enabled.checked){ delete config[selected]; return; }

    config[selected]={
      duration:duration.value,
      start:startTime.value,
      end:endTime.value,
      startDate:startDate.value,
      endDate:endDate.value,
      expiry:expiry.value
    };
  };
});

/* UPLOAD */
fileInput.onchange=e=>{
  newFiles=[...e.target.files];
  uploadPreview.innerHTML="";

  newFiles.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="previewCard";

    const img=document.createElement("img");
    img.src=URL.createObjectURL(f);

    const input=document.createElement("input");
    input.value=f.name;
    input.oninput=()=>f.customName=input.value;

    const status=document.createElement("div");
    status.id="status_"+i;

    div.appendChild(img);
    div.appendChild(input);
    div.appendChild(status);
    uploadPreview.appendChild(div);
  });

  upload();
};

async function upload(){
  for(let i=0;i<newFiles.length;i++){
    const f=newFiles[i];
    const name=f.customName||f.name;

    try{
      document.getElementById("status_"+i).innerText="Uploading";

      const base64=await toBase64(f);

      await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/slides/${name}`,{
        method:"PUT",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({message:"upload",content:base64})
      });

      files.push(name);
      document.getElementById("status_"+i).innerText="Done";

    }catch(e){
      document.getElementById("status_"+i).innerText="Error";
    }
  }
  render();
}

/* DELETE */
async function deleteSlide(){
  if(!selected)return;

  const file = await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/slides/${selected}`);

  await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/slides/${selected}`,{
    method:"DELETE",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({message:"delete",sha:file.sha})
  });

  delete config[selected];
  files=files.filter(f=>f!==selected);
  selected=null;
  screenEl.innerHTML="";
  render();
}

/* SAVE CONFIG */
async function saveConfig(){

  let content="default | 10\n\nslides:\n";

  files.forEach(n=>{
    const c=config[n]||{};
    let line=n;
    if(c.duration)line+=` | ${c.duration}`;
    if(c.start)line+=` | ${c.start}`;
    if(c.end)line+=` | ${c.end}`;
    if(c.startDate)line+=` | ${c.startDate}`;
    if(c.endDate)line+=` | ${c.endDate}`;
    if(c.expiry)line+=` | ${c.expiry}`;
    content+=line+"\n";
  });

  const file = await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/config.txt`);

  await githubFetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/config.txt`,{
    method:"PUT",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      message:"update config",
      content:btoa(unescape(encodeURIComponent(content))),
      sha:file.sha
    })
  });

  alert("Saved!");
}

/* BASE64 */
function toBase64(f){
  return new Promise(r=>{
    const reader=new FileReader();
    reader.onload=()=>r(reader.result.split(",")[1]);
    reader.readAsDataURL(f);
  });
}

</script>

</body>
</html>
