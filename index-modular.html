<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Admin</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN PANE -->
<div id="login">
  <div id="loginBox">
    <h3>GitHub Token</h3>
    <input type="password" id="tokenInput"><br><br>
    <button onclick="start()">Start</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <!-- HEADER BAND -->
  <div class="header-band">
    <h1>Estancia Noticeboard <span class="accent">Admin Configuration</span></h1>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="upload-plus-btn" onclick="insertAtIndex = selected ? files.indexOf(selected) + 1 : -1; bulkFileInput.click()" title="Upload slides">+</button>
    </div>
    <div class="topbar-mid">
      <label for="thumbFilter">Filter</label>
      <select id="thumbFilter">
        <option value="all">All</option>
        <option value="__disabled">Disabled</option>
      </select>

      <label for="transitionEffect">Transition</label>
      <select id="transitionEffect">
        <option value="cut">Cut</option>
        <option value="fade" selected>Fade</option>
        <option value="zoom">Zoom</option>
      </select>
    </div>
    <div class="topbar-right emergency-controls">
      <button class="danger-lite" onclick="activateEmergencyFromSelected()">Emergency ON</button>
      <button onclick="clearEmergencyOverride()">Emergency OFF</button>
      <span id="emergencyStatus">Emergency: OFF</span>
    </div>
  </div>

  <input type="file" id="fileInput" style="display:none">
  <input type="file" id="bulkFileInput" multiple style="display:none">

  <!-- UPLOAD PREVIEW MODAL -->
  <div id="uploadModal" class="modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <h3>Review uploads</h3>
        <button class="modal-close" onclick="cancelUpload()" title="Cancel">&times;</button>
      </div>
      <div id="uploadOptions" class="upload-options" style="display:none">
        <div class="upload-option-group">
          <span class="upload-option-label">Bulk upload mode</span>
          <label class="upload-mode-pill">
            <input type="radio" name="uploadMode" value="individual" checked>
            <span>Individual slides</span>
          </label>
          <label class="upload-mode-pill">
            <input type="radio" name="uploadMode" value="collage">
            <span>Single collage slide</span>
          </label>
        </div>

        <div id="collagePanes" class="collage-panes" style="display:none">
          <div class="collage-pane-left">
            <div id="collageOptions" class="collage-options">
              <div class="upload-option-row">
                <label for="collageType">Collage type</label>
                <select id="collageType">
                  <option value="g">Gardening</option>
                  <option value="p">Pest Control</option>
                  <option value="h">Housekeeping</option>
                  <option value="m">Maintenance</option>
                  <option value="x">Generic</option>
                </select>
              </div>

              <div id="collageTitleRow" class="upload-option-row" style="display:none">
                <label for="collageTitle">Custom title</label>
                <input type="text" id="collageTitle" placeholder="Enter collage title">
              </div>

              <div class="upload-option-row">
                <label for="collageFileName">Output filename</label>
                <input type="text" id="collageFileName" value="gardening-estancia-collage.png">
              </div>

              <div id="collageStatus" class="collage-status"></div>
            </div>
          </div>

          <div class="collage-pane-right">
            <div id="collagePreviewWrap" class="collage-preview-wrap">
              <div class="collage-preview-frame">
                <canvas id="collagePreviewCanvas"></canvas>
              </div>
              <button type="button" class="slot-add-btn" onclick="refreshCollagePreview()">↻ Refresh</button>
            </div>
          </div>
        </div>
      </div>
      <div id="uploadPreview"></div>
      <div class="modal-footer" id="defaultModalFooter">
        <button onclick="cancelUpload()">Cancel</button>
        <button id="uploadConfirmBtn" class="primary" onclick="confirmUpload()">Upload</button>
      </div>
    </div>
  </div>

  <!-- CONTAINER (LEFT, CENTER, RIGHT) -->
  <div class="container">
    <!-- LEFT PANE: THUMBNAILS -->
    <div class="left" id="thumbList"></div>

    <!-- CENTER PANE: TV PREVIEW -->
    <div class="center">
      <div class="nav-controls">
        <button onclick="navSlide(-1)" title="Previous slide">&larr; Prev</button>
        <span id="slideCounter"></span>
        <button onclick="navSlide(1)" title="Next slide">Next &rarr;</button>
      </div>
      <div class="tv">
        <div class="tv-bezel">
          <div class="screen" id="screenEl"></div>
          <div class="tv-brand">SAMSUNG</div>
        </div>
        <div class="tv-chin"></div>
        <div class="tv-stand">
          <div class="tv-stand-neck"></div>
          <div class="tv-stand-base"></div>
        </div>
      </div>
    </div>
    <div class="right">
      <div id="multiSelectBar" style="display:none" class="multi-select-bar">
        <span class="multi-count"></span>
        <button class="primary" onclick="applyToMultiSelected()">Apply to all</button>
        <button onclick="multiSelected.clear(); updateMultiSelectBar(); render()">Clear</button>
      </div>
      <h3 id="titleEl">Slide</h3>

      <div class="field"><label>Duration</label><input id="duration" placeholder="seconds (e.g. 10)"></div>

      <div class="field">
        <label>Time slots</label>
        <div id="timeSlotsContainer" class="slots-container"></div>
        <button class="slot-add-btn" type="button" onclick="addTimeSlot()">+ Add time slot</button>
      </div>

      <div class="field">
        <label>Date ranges</label>
        <div id="dateRangesContainer" class="slots-container"></div>
        <button class="slot-add-btn" type="button" onclick="addDateRange()">+ Add date range</button>
      </div>

      <div class="field"><label>Expiry</label><input id="expiry" placeholder="e.g. 2h, 7d"></div>

      <div class="field location-field">
        <label>Locations</label>
        <p class="loc-hint">No locations selected = slide is disabled</p>
        <div id="locationPicker" class="location-picker"></div>
      </div>

      <button class="save-btn" onclick="saveConfig()">Save</button>
    </div>

  </div>
</div>

<!-- SCRIPTS - Load in dependency order -->
<script src="js/github.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/upload.js"></script>
<script src="js/app.js"></script>

</body>
</html>
