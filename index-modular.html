<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Admin</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- LOGIN PANE -->
<div id="login">
  <div id="loginBox">
    <h3>GitHub Token</h3>
    <input type="password" id="tokenInput"><br><br>
    <button onclick="start()">Start</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <!-- TOPBAR -->
  <div class="topbar">
    <button onclick="fileInput.click()">Upload</button>
    <button onclick="saveConfig()">Save</button>
  </div>

  <input type="file" id="fileInput" multiple style="display:none">

  <!-- UPLOAD PREVIEW -->
  <div id="uploadPreview"></div>

  <!-- CONTAINER (LEFT, CENTER, RIGHT) -->
  <div class="container">
    <!-- LEFT PANE: THUMBNAILS -->
    <div class="left" id="thumbList"></div>

    <!-- CENTER PANE: TV PREVIEW -->
    <div class="center">
      <div class="tv">
        <div class="screen" id="screenEl"></div>
      </div>
    </div>

    <!-- RIGHT PANE: PROPERTIES -->
    <div class="right">
      <h3 id="titleEl">Slide</h3>
      <label><input type="checkbox" id="enabled"> Enable</label>

      <div class="field">Duration <input id="duration"></div>
      <div class="field">Start <input type="time" id="startTime"></div>
      <div class="field">End <input type="time" id="endTime"></div>
      <div class="field">Start Date <input type="date" id="startDate"></div>
      <div class="field">End Date <input type="date" id="endDate"></div>
      <div class="field">Expiry <input id="expiry"></div>

      <button class="deleteBtn" onclick="deleteSlide()">Delete</button>
    </div>

  </div>
</div>

<!-- SCRIPTS - Load in dependency order -->
<script src="js/github.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/upload.js"></script>
<script src="js/app.js"></script>

</body>
</html>
