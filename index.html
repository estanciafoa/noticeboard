<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Notice Board</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: system-ui;
}

/* FRAME (9:16 portrait) */
#frame {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: black;
  overflow: hidden;
}

@media (max-aspect-ratio: 9/16) {
  #frame { width: 100vw; height: calc(100vw * 16 / 9); }
}
@media (min-aspect-ratio: 9/16) {
  #frame { height: 100vh; width: calc(100vh * 9 / 16); }
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-ms, 700ms) ease, transform var(--transition-ms, 700ms) ease;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
}

#frame.effect-cut .slide {
  transition: none;
}

#frame.effect-zoom .slide {
  transform: scale(1.03);
}

#frame.effect-zoom .slide.active {
  transform: scale(1);
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* BOTTOM BAR */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 37px;
  background: #000;
  color: #fff;
  z-index: 10;
  overflow: visible;
  display: flex;
  align-items: center;
}
@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.4; }
}

/* LEFT: fixed common info (20%) */
.ticker-left {
  width: calc(20% + 20px);
  min-width: 0;
  padding: 2px 6px;
  font-size: 8px;
  line-height: 1.2;
  color: #ccc;
  overflow: hidden;
  border-right: 1px solid #333;
  flex-shrink: 0;
  box-sizing: border-box;
  display: flex;
  align-items: center;
}
.ticker-left span {
  white-space: pre-line;
  word-break: break-word;
}
.ticker-left img {
  height: 100%;
  max-width: 100%;
  object-fit: contain;
}

/* CENTER: scrolling tower-specific text */
.ticker-center {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
}
.ticker-center .ticker-scroll {
  display: inline-block;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  padding-left: 100%;
  animation: ticker-scroll-anim var(--ticker-duration, 20s) linear infinite;
}
@keyframes ticker-scroll-anim {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* RIGHT: logo area */
.ticker-right {
  flex-shrink: 0;
  width: 80px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  box-sizing: border-box;
}
.ticker-right .label {
  display: none;
}
.ticker-right img {
  height: 32px;
  object-fit: contain;
}

.bottom-bar .network-status {
  position: absolute;
  left: 5px;
  bottom: 7px;
  max-width: calc(100% - 110px);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  color: white;
  letter-spacing: 0.2px;
  display: none;
  z-index: 20;
  background: #dc2626;
  padding: 5px 11px;
  border-radius: 18px;
  white-space: nowrap;
  animation: blink 1.2s infinite;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.6);
  overflow: hidden;
  text-overflow: ellipsis;
}

/* EMPTY STATE */
#empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="frame">
  <div id="empty">Loading…</div>
  <div class="bottom-bar">
    <div id="networkStatus" class="network-status"></div>
    <div class="ticker-left" id="tickerLeft"></div>
    <div class="ticker-center">
      <span class="ticker-scroll" id="tickerScroll"></span>
    </div>
    <div class="ticker-right">
      <div class="label">Flat Owners Association</div>
      <img src="images/estancialogo.png" alt="Estancia">
    </div>
  </div>
</div>

<script>
/* Bootstrap: load viewer.js — local on localhost, from raw GitHub in production */
(function() {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var src = 'https://raw.githubusercontent.com/estanciafoa/noticeboard/main/viewer.js?t=' + Date.now();
  var fallbackSrc = 'viewer.js?t=' + Date.now();

  function loadFallback() {
    var s = document.createElement('script');
    s.src = fallbackSrc;
    document.body.appendChild(s);
  }

  if (isLocal) { loadFallback(); return; }

  fetch(src)
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function(code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    })
    .catch(loadFallback);
})();
</script>

</body>
</html>
