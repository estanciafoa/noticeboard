<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Notice Board</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: system-ui;
}

/* FRAME (9:16 portrait) */
#frame {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: black;
  overflow: hidden;
}

@media (max-aspect-ratio: 9/16) {
  #frame { width: 100vw; height: calc(100vw * 16 / 9); }
}
@media (min-aspect-ratio: 9/16) {
  #frame { height: 100vh; width: calc(100vh * 9 / 16); }
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-ms, 700ms) ease, transform var(--transition-ms, 700ms) ease;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
}

#frame.effect-cut .slide {
  transition: none;
}

#frame.effect-zoom .slide {
  transform: scale(1.03);
}

#frame.effect-zoom .slide.active {
  transform: scale(1);
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* BOTTOM BAR */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0;
  background: #000;
  color: #fff;
  z-index: 10;
  overflow: visible;
  display: flex;
  align-items: center;
  transition: height 0.3s, background 0.3s;
}
.bottom-bar.has-ticker {
  height: 64px;
}
.bottom-bar.flash-news {
  height: 90px;
  background: #cc0000;
  padding-top: 15px;
}
.bottom-bar.flash-news .ticker-left,
.bottom-bar.flash-news .ticker-right {
  display: none;
}

/* Attention tag */
.attention-tag {
  display: none;
  position: absolute;
  top: -30px;
  left: 16px;
  background: #f5c518;
  color: #000;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 22px;
  transform: skewX(-12deg);
  z-index: 11;
  line-height: 1.4;
  border: 1px solid #000000;
  border-radius: 5px;
}
.bottom-bar.flash-news .attention-tag {
  display: block;
  animation: attention-pulse 1.2s ease-in-out infinite;
}

@keyframes attention-pulse {
  0%, 100% {
    filter: brightness(1);
    box-shadow: 0 0 0 rgba(245, 197, 24, 0);
  }
  50% {
    filter: brightness(1.18);
    box-shadow: 0 0 10px rgba(245, 197, 24, 0.85);
  }
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.4; }
}

/* LEFT: fixed common info (20%) */
.ticker-left {
  min-width: 0;
  padding: 4px 10px;
  line-height: 1.3;
  color: #ccc;
  overflow: hidden;
  border-right: 1px solid #333;
  flex-shrink: 0;
  box-sizing: border-box;
  display: flex;
  align-items: center;
}
.ticker-left span {
  white-space: pre-line;
  word-break: break-word;
}

/* CENTER: rotating ticker text */
.ticker-center {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 400px;
}
.ticker-center .ticker-scroll-wrap {
  width: 100%;
  text-align: center;
  white-space: normal;
  word-break: break-word;
  padding: 4px 16px;
  box-sizing: border-box;
  animation: ticker-zoom 7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  transform-style: preserve-3d;
}
.ticker-center .ticker-scroll-wrap .ticker-text {
  font-size: 28px;
  font-weight: 500;
  color: #fff;
  display: none;
}
.ticker-center .ticker-scroll-wrap .ticker-text:first-child {
  display: inline;
  white-space: pre-line;
}
.bottom-bar.flash-news .ticker-text {
  font-size: 34px !important;
  font-weight: 700 !important;
  font-style: italic;
  line-height: 1.3;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
}
@keyframes ticker-zoom {
  0%   { transform: scale(0); opacity: 0; }
  5%   { transform: scale(1.05); opacity: 1; }
  8%   { transform: scale(1); opacity: 1; }
  88%  { transform: scale(1); opacity: 1; }
  93%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(0); opacity: 0; }
}
@keyframes ticker-flip {
  0%   { transform: rotateY(90deg); opacity: 0; }
  5%   { transform: rotateY(-5deg); opacity: 1; }
  8%   { transform: rotateY(0deg); opacity: 1; }
  88%  { transform: rotateY(0deg); opacity: 1; }
  93%  { transform: rotateY(-5deg); opacity: 1; }
  100% { transform: rotateY(90deg); opacity: 0; }
}
@keyframes ticker-slide-up {
  0%   { transform: translateY(100%); opacity: 0; }
  5%   { transform: translateY(-3%); opacity: 1; }
  8%   { transform: translateY(0); opacity: 1; }
  88%  { transform: translateY(0); opacity: 1; }
  93%  { transform: translateY(-3%); opacity: 1; }
  100% { transform: translateY(100%); opacity: 0; }
}
@keyframes ticker-drop {
  0%   { transform: translateY(-100%) scale(0.8); opacity: 0; }
  4%   { transform: translateY(8%) scale(1.02); opacity: 1; }
  6%   { transform: translateY(-3%); opacity: 1; }
  8%   { transform: translateY(0) scale(1); opacity: 1; }
  88%  { transform: translateY(0) scale(1); opacity: 1; }
  93%  { transform: translateY(-3%) scale(1.02); opacity: 1; }
  100% { transform: translateY(-100%) scale(0.8); opacity: 0; }
}
@keyframes ticker-slide-right {
  0%   { transform: translateX(100%); opacity: 0; }
  5%   { transform: translateX(-2%); opacity: 1; }
  8%   { transform: translateX(0); opacity: 1; }
  88%  { transform: translateX(0); opacity: 1; }
  93%  { transform: translateX(-2%); opacity: 1; }
  100% { transform: translateX(100%); opacity: 0; }
}
@keyframes ticker-slide-left {
  0%   { transform: translateX(-100%); opacity: 0; }
  5%   { transform: translateX(2%); opacity: 1; }
  8%   { transform: translateX(0); opacity: 1; }
  88%  { transform: translateX(0); opacity: 1; }
  93%  { transform: translateX(2%); opacity: 1; }
  100% { transform: translateX(-100%); opacity: 0; }
}

/* RIGHT: logo area */
.ticker-right {
  flex-shrink: 0;
  width: 123px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  box-sizing: border-box;
}
.ticker-right .label {
  display: none;
}
.ticker-right img {
  height: 80px;
  width: 130px;
  object-fit: contain;
}

.bottom-bar .network-status {
  position: absolute;
  left: 5px;
  bottom: 7px;
  max-width: calc(100% - 110px);
  font-size: 11px;
  font-weight: 600;
  line-height: 1.3;
  color: white;
  letter-spacing: 0.2px;
  display: none;
  z-index: 20;
  background: #dc2626;
  padding: 5px 11px;
  border-radius: 18px;
  white-space: nowrap;
  animation: blink 1.2s infinite;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.6);
  overflow: hidden;
  text-overflow: ellipsis;
}

/* EMPTY STATE */
#empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="frame">
  <div id="empty">Loading…</div>
  <div class="bottom-bar">
    <div id="networkStatus" class="network-status"></div>
    <div class="attention-tag">Attention !</div>

    <div class="ticker-left" id="tickerLeft"></div>
    <div class="ticker-center">
      <div class="ticker-scroll-wrap" id="tickerScrollWrap">
        <span class="ticker-text" id="tickerScroll"></span>
        <span class="ticker-text" id="tickerScroll2"></span>
      </div>
    </div>
    <div class="ticker-right">
      <div class="label">Flat Owners Association</div>
      <img src="images/estancialogo.png" alt="Estancia">
    </div>
  </div>
</div>

<script>
/* Bootstrap: load viewer.js — local on localhost, from raw GitHub in production */
(function() {
  var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  /* Register the service worker so the app shell + slide media are cached and
     the board can boot/display with no internet. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }

  var src = 'https://raw.githubusercontent.com/estanciafoa/noticeboard/main/viewer.js?t=' + Date.now();
  var fallbackSrc = 'viewer.js?t=' + Date.now();

  function loadFallback() {
    var s = document.createElement('script');
    s.src = fallbackSrc;
    document.body.appendChild(s);
  }

  if (isLocal) { loadFallback(); return; }

  fetch(src)
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function(code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    })
    .catch(loadFallback);
})();
</script>

</body>
</html>
