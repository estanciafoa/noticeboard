<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Notice Board</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: system-ui;
}

/* FRAME (9:16 portrait) */
#frame {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: black;
  overflow: hidden;
}

@media (max-aspect-ratio: 9/16) {
  #frame { width: 100vw; height: calc(100vw * 16 / 9); }
}
@media (min-aspect-ratio: 9/16) {
  #frame { height: 100vh; width: calc(100vh * 9 / 16); }
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-ms, 700ms) ease, transform var(--transition-ms, 700ms) ease;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
}

#frame.effect-cut .slide {
  transition: none;
}

#frame.effect-zoom .slide {
  transform: scale(1.03);
}

#frame.effect-zoom .slide.active {
  transform: scale(1);
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}

/* BOTTOM BAR */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 37px;
  background: #000;
  color: #fff;
  z-index: 10;
}
.bottom-bar .label {
  position: absolute;
  font-size: 6px;
  font-style: italic;
  right: 4px;
  top: 26px;
}
.bottom-bar img {
  height: 80px;
  position: absolute;
  right: 3px;
  top: -26px;
}

/* EMPTY STATE */
#empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="frame">
  <div id="empty">Loading…</div>
  <div class="bottom-bar">
    <div class="label">Flat Owners Association</div>
    <img src="images/estancialogo.png" alt="Estancia">
  </div>
</div>

<script>
/* Bootstrap: load viewer.js from raw GitHub (always fresh, bypasses Pages CDN cache) */
(function() {
  var src = 'https://raw.githubusercontent.com/estanciafoa/noticeboard/main/viewer.js?t=' + Date.now();
  var fallbackSrc = 'viewer.js?t=' + Date.now();

  function loadFallback() {
    var s = document.createElement('script');
    s.src = fallbackSrc;
    document.body.appendChild(s);
  }

  fetch(src)
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then(function(code) {
      var s = document.createElement('script');
      s.textContent = code;
      document.body.appendChild(s);
    })
    .catch(loadFallback);
})();
</script>

</body>
</html>
