<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Estancia Display</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

.slide {
  position: fixed; /* key change */
  top: 0;
  left: 0;
  width: 100vw;   /* full viewport width */
  height: 100vh;  /* full viewport height */
  opacity: 0;
  pointer-events: none;
}

.slide img,
.slide video {
  width: 100%;
  height: 100%;
  object-fit: cover; /* fills screen nicely */
}

.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 10;
  animation: fade 1s;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<script>
const repoOwner = "saravanansengamalan";
const repoName = "estancianoticeboard";

const configUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/config.txt`;

let defaultDuration = 10000;
let slides = [];
let slideElements = [];
let index = 0;
let refreshInterval = 300000; // 5 minutes

// LOAD CONFIG
async function loadConfig() {
  const res = await fetch(configUrl + "?t=" + Date.now());
  const text = await res.text();

  const lines = text.split("\n").map(l => l.trim()).filter(Boolean);

  slides = [];
  let inSlides = false;

  lines.forEach(line => {

    if (line.startsWith("#")) return;

    if (line.toLowerCase() === "slides:") {
      inSlides = true;
      return;
    }

    if (!inSlides) {
      const parts = line.split("|").map(p => p.trim());
      if (parts[0].toLowerCase() === "default") {
        defaultDuration = Number(parts[1]) * 1000;
      }
      return;
    }

    // Parse slide line
    const parts = line.split("|").map(p => p.trim());

    slides.push({
      name: parts[0],
      duration: parts[1] === "auto"
        ? "auto"
        : parts[1]
        ? Number(parts[1]) * 1000
        : defaultDuration,
      start: parts[2] || null,
      end: parts[3] || null
    });
  });
}

// TIME FILTER
function isVisible(slide) {
  if (!slide.start || !slide.end) return true;

  const now = new Date();
  const current = now.getHours() * 60 + now.getMinutes();

  const [sh, sm] = slide.start.split(":").map(Number);
  const [eh, em] = slide.end.split(":").map(Number);

  const startMin = sh * 60 + sm;
  const endMin = eh * 60 + em;

  return current >= startMin && current <= endMin;
}

// BUILD SLIDES
function buildSlides() {
  slideElements.forEach(el => el.remove());
  slideElements = [];

  slides.forEach(slide => {

    if (!isVisible(slide)) return;

    const div = document.createElement("div");
    div.className = "slide";

    const fileUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/slides/${slide.name}?t=${Date.now()}`;

    if (slide.name.match(/\.mp4$/i)) {
      const video = document.createElement("video");
      video.src = fileUrl;
      video.autoplay = true;
      video.playsInline = true;
      video.style.width = "100%";
      video.style.height = "100%";
      video.style.objectFit = "cover";

      div.appendChild(video);

      video.onended = nextSlide;

    } else {
      const img = document.createElement("img");
      img.src = fileUrl;

      div.appendChild(img);

      div.dataset.duration = slide.duration;
    }

    document.body.appendChild(div);
    slideElements.push(div);
  });

  index = 0;
  showSlide(index);
}

// SHOW SLIDE
function showSlide(i) {
  if (slideElements.length === 0) return;

  slideElements.forEach(s => s.classList.remove("active"));

  let slide = slideElements[i];
  slide.classList.add("active");

  let video = slide.querySelector("video");

  if (video) {
    video.currentTime = 0;
    video.muted = false;
    video.play().catch(()=>{});
  } else {
    setTimeout(nextSlide, slide.dataset.duration);
  }
}

// NEXT SLIDE
function nextSlide() {
  index = (index + 1) % slideElements.length;
  showSlide(index);
}

// AUTO REFRESH
async function refreshSlides() {
  try {
    await loadConfig();
    buildSlides();
    console.log("🔄 Slides updated");
  } catch (e) {
    console.log("Error:", e);
  }
}

// INIT
async function init() {
  await loadConfig();
  buildSlides();

  setInterval(refreshSlides, refreshInterval);

  // safety full reload every hour
  setInterval(() => location.reload(), 3600000);
}

init();
</script>

</body>
</html>
