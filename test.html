<script>
const repoOwner = "saravanansengamalan";
const repoName = "estancianoticeboard";

const slidesPath = "slides";
const configFile = "config.txt";

let defaultDuration = 10000;
let configMap = {};
let slideFiles = [];
let slideElements = [];
let index = 0;
let refreshInterval = 300000;

// LOAD CONFIG
async function loadConfig() {
  const url = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${configFile}?t=${Date.now()}`;
  const res = await fetch(url);
  const text = await res.text();

  const lines = text.split("\n").filter(l => l.trim() && !l.startsWith("#"));

  configMap = {};

  lines.forEach(line => {
    const parts = line.split("|").map(p => p.trim());

    if (parts[0].toLowerCase() === "default") {
      defaultDuration = Number(parts[1]) * 1000;
    } else {
      configMap[parts[0]] = {
        duration: parts[1] === "auto" ? "auto" : Number(parts[1]) * 1000,
        start: parts[2] || null,
        end: parts[3] || null
      };
    }
  });
}

// LOAD FILES FROM GITHUB
async function loadSlidesList() {
  const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${slidesPath}`;
  const res = await fetch(url);
  const files = await res.json();

  slideFiles = files.filter(file =>
    file.name.match(/\.(jpg|jpeg|png|mp4)$/i)
  );
}

// TIME FILTER
function isVisible(cfg) {
  if (!cfg.start || !cfg.end) return true;

  const now = new Date();
  const current = now.getHours() * 60 + now.getMinutes();

  const [sh, sm] = cfg.start.split(":").map(Number);
  const [eh, em] = cfg.end.split(":").map(Number);

  const startMin = sh * 60 + sm;
  const endMin = eh * 60 + em;

  return current >= startMin && current <= endMin;
}

// BUILD SLIDES
function buildSlides() {
  slideElements.forEach(el => el.remove());
  slideElements = [];

  slideFiles.forEach(file => {

    const cfg = configMap[file.name] || {
      duration: defaultDuration,
      start: null,
      end: null
    };

    if (!isVisible(cfg)) return;

    const div = document.createElement("div");
    div.className = "slide";

    const fileUrl = file.download_url + "?t=" + Date.now();

    if (file.name.match(/\.mp4$/i)) {
      const video = document.createElement("video");
      video.src = fileUrl;
      video.autoplay = true;
      video.playsInline = true;
      video.style.width = "100%";
      video.style.height = "100%";
      video.style.objectFit = "cover";

      div.appendChild(video);

      video.onended = nextSlide;

    } else {
      const img = document.createElement("img");
      img.src = fileUrl;

      div.appendChild(img);

      div.dataset.duration = cfg.duration || defaultDuration;
    }

    document.body.appendChild(div);
    slideElements.push(div);
  });

  index = 0;
  showSlide(index);
}

// SHOW SLIDE
function showSlide(i) {
  if (slideElements.length === 0) return;

  slideElements.forEach(s => s.classList.remove("active"));

  let slide = slideElements[i];
  slide.classList.add("active");

  let video = slide.querySelector("video");

  if (video) {
    video.currentTime = 0;
    video.muted = false;
    video.play().catch(()=>{});
  } else {
    setTimeout(nextSlide, slide.dataset.duration);
  }
}

// NEXT
function nextSlide() {
  index = (index + 1) % slideElements.length;
  showSlide(index);
}

// REFRESH
async function refreshSlides() {
  try {
    await loadConfig();
    await loadSlidesList();

    console.log("🔄 Refreshing slides...");
    buildSlides();

  } catch (e) {
    console.log("Refresh error", e);
  }
}

// INIT
async function init() {
  await loadConfig();
  await loadSlidesList();
  buildSlides();

  setInterval(refreshSlides, refreshInterval);
  setInterval(() => location.reload(), 3600000);
}

init();
</script>
